  recorders:
    dataset_file_handler_class_type: isaaclab.utils.datasets.hdf5_dataset_file_handler:HDF5DatasetFileHandler
    dataset_export_dir_path: /tmp/isaaclab/logs
    dataset_filename: dataset
    dataset_export_mode:
      _value_: 1
      _name_: EXPORT_ALL
      _sort_order_: 1
    export_in_record_pre_reset: true
    export_in_close: false
  observations:
    policy:
      concatenate_terms: true
      concatenate_dim: -1
      enable_corruption: false
      history_length: 2
      flatten_history_dim: true
      base_ang_vel:
        func: isaaclab.envs.mdp.observations:base_ang_vel
        params: {}
        modifiers: null
        noise:
          func: isaaclab.utils.noise.noise_model:uniform_noise
          operation: add
          n_min: -0.1
          n_max: 0.1
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      projected_gravity:
        func: isaaclab.envs.mdp.observations:projected_gravity
        params: {}
        modifiers: null
        noise:
          func: isaaclab.utils.noise.noise_model:uniform_noise
          operation: add
          n_min: -0.03
          n_max: 0.03
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      command:
        func: wbc_base.mdp.observations:velocity_body_pose_command
        params:
          command_name: base_velocity
          body_height_m: 0.94
        modifiers: null
        noise: null
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      joint_pos_rel:
        func: isaaclab.envs.mdp.observations:joint_pos_rel
        params:
          asset_cfg:
            name: robot
            joint_names:
            - Joint_Hip_Pitch_Left
            - Joint_Hip_Roll_Left
            - Joint_Hip_Yaw_Left
            - Joint_Knee_Pitch_Left
            - Joint_Ankle_Pitch_Left
            - Joint_Ankle_Roll_Left
            - Joint_Hip_Pitch_Right
            - Joint_Hip_Roll_Right
            - Joint_Hip_Yaw_Right
            - Joint_Knee_Pitch_Right
            - Joint_Ankle_Pitch_Right
            - Joint_Ankle_Roll_Right
            - Joint_Waist_Yaw
            - Joint_Waist_Roll
            - Joint_Waist_Pitch
            joint_ids: slice(None,None,None)
            fixed_tendon_names: null
            fixed_tendon_ids: slice(None,None,None)
            body_names: null
            body_ids: slice(None,None,None)
            object_collection_names: null
            object_collection_ids: slice(None,None,None)
            preserve_order: true
        modifiers: null
        noise:
          class_type: isaaclab.utils.noise.noise_model:NoiseModelWithAdditiveBias
          noise_cfg:
            func: isaaclab.utils.noise.noise_model:uniform_noise
            operation: add
            n_min: -0.03
            n_max: 0.03
          func: null
          bias_noise_cfg:
            func: isaaclab.utils.noise.noise_model:uniform_noise
            operation: add
            n_min: -0.05
            n_max: 0.05
          sample_bias_per_component: true
        clip: null
        scale: null
        history_length: 0
        flatten_history_dim: true
      joint_vel:
        func: isaaclab.envs.mdp.observations:joint_vel
        params:
          asset_cfg:
            name: robot
            joint_names:
